name: Coverage

on:
  pull_request:
    branches: [main]
    paths: [ 'parshift/**', 'tests/**', 'pyproject.toml', '.github/workflows/cov.yml' ]
  push:
    branches: [main]
    paths: [ 'parshift/**', 'tests/**', 'pyproject.toml', '.github/workflows/cov.yml' ]
    tags: '*'

# Non-interactive Matplotlib backend, so that tests do not depend on Tcl/Tk
env:
  MPLBACKEND: Agg

jobs:
  calculate-coverage:
    runs-on: ubuntu-latest
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        pip install pip --upgrade
        pip install .[dev]
    - name: Test with pytest and create coverage report
      run: pytest --cov=parshift --cov-report=xml
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}