name: Docs

on:
  push:
    tags: 'v*'
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Build docs
        run: |
          pip3 install --upgrade pip
          pip3 install .[dev]
          cd docs
          mkdocs build --strict
      - name: Deploy to GitHub pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs/site